# This rule is not used by the project passwordstore-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the passwordstore.k8s.sorend.github.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: passwordstore-operator
    app.kubernetes.io/managed-by: kustomize
  name: clusterpasswordstore-editor-role
rules:
- apiGroups:
  - passwordstore.k8s.sorend.github.com
  resources:
  - clusterpasswordstores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - passwordstore.k8s.sorend.github.com
  resources:
  - clusterpasswordstores/status
  verbs:
  - get

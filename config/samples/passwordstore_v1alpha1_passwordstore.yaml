# A password store in a private GitHub repository, read with a personal access token.
#
# Create the Secrets it refers to first:
#
#   kubectl create secret generic infra-git-token --from-literal=token=<a token that can read the repository>
#   kubectl create secret generic infra-gpg-key --from-file=private.key=<(gpg --export-secret-keys --armor <key id>)
#
apiVersion: passwordstore.k8s.sorend.github.com/v1alpha1
kind: PasswordStore
metadata:
  name: infra
spec:
  gitRepo:
    url: https://github.com/example/password-store.git
    branch: main
    auth:
      token:
        tokenSecretRef:
          name: infra-git-token # key "token"
  gpg:
    # The key id, fingerprint or email address that "pass init" was given.
    id: infra@example.com
    privateKeySecretRef:
      name: infra-gpg-key # key "private.key"

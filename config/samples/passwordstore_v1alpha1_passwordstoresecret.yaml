# A Secret made from entries of the PasswordStore "infra". Every value in data is the path of an
# entry in the store, without the .gpg suffix.
apiVersion: passwordstore.k8s.sorend.github.com/v1alpha1
kind: PasswordStoreSecret
metadata:
  name: postgres
spec:
  storeRef:
    name: infra # kind: PasswordStore, the default. Use kind: ClusterPasswordStore for a cluster store.
  refreshInterval: 5m # the default
  template:
    metadata:
      name: postgres-credentials # defaults to the name of this resource
      labels:
        app.kubernetes.io/part-of: postgres
    type: kubernetes.io/basic-auth
  data:
    # The whole entry: k8s/postgres.db.svc/admin-user.gpg
    password: k8s/postgres.db.svc/admin-user
    # The value of the line "username: admin" in the entry k8s/postgres.db.svc/connection
    username: k8s/postgres.db.svc/connection#username
    # The first line of the entry, which pass treats as the password
    # token: k8s/postgres.db.svc/connection#1

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: clusterpasswordstores.passwordstore.k8s.sorend.github.com
spec:
  group: passwordstore.k8s.sorend.github.com
  names:
    kind: ClusterPasswordStore
    listKind: ClusterPasswordStoreList
    plural: clusterpasswordstores
    shortNames:
    - cpws
    singular: clusterpasswordstore
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.revision
      name: Revision
      type: string
    - jsonPath: .spec.gitRepo.url
      name: URL
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterPasswordStore is a pass(1) password store in a Git repository that PasswordStoreSecrets
          in any namespace can read from, optionally limited by namespaceSelector. Because it is not
          namespaced, every Secret reference in its spec must name a namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ClusterPasswordStore
            properties:
              gitRepo:
                description: gitRepo describes the Git repository that holds the password
                  store.
                properties:
                  auth:
                    description: |-
                      auth configures how to authenticate to the repository. Omit it to clone anonymously,
                      which only works for public repositories over http(s).
                    properties:
                      app:
                        description: |-
                          app authenticates over https as a GitHub App installation. The operator signs a JWT with
                          the App's private key and exchanges it for a short-lived, read-only installation token.
                        properties:
                          appID:
                            description: appID is the numeric ID of the GitHub App.
                            format: int64
                            minimum: 1
                            type: integer
                          baseURL:
                            description: |-
                              baseURL of the GitHub API. Defaults to https://api.github.com. For GitHub Enterprise
                              Server use https://HOSTNAME/api/v3.
                            maxLength: 2048
                            pattern: ^https?://[^@\s]+$
                            type: string
                          installationID:
                            description: |-
                              installationID is the numeric ID of the installation of the App that has access to the
                              repository.
                            format: int64
                            minimum: 1
                            type: integer
                          privateKeySecretRef:
                            description: |-
                              privateKeySecretRef selects the Secret key that holds the App's private key in PEM
                              format. The key defaults to "private-key.pem".
                            properties:
                              key:
                                description: |-
                                  key within the Secret's data. When omitted a default that depends on the referencing
                                  field is used; the default is documented on that field.
                                maxLength: 253
                                pattern: ^[-._a-zA-Z0-9]+$
                                type: string
                              name:
                                description: name of the Secret.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                              namespace:
                                description: |-
                                  namespace of the Secret. Required on a ClusterPasswordStore. On a PasswordStore it may be
                                  omitted and otherwise must equal the namespace of the store: cross-namespace references
                                  are not allowed.
                                maxLength: 63
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - appID
                        - installationID
                        - privateKeySecretRef
                        type: object
                      ssh:
                        description: ssh authenticates with an SSH private key. Requires
                          an ssh:// or scp-style URL.
                        properties:
                          insecureIgnoreHostKey:
                            description: |-
                              insecureIgnoreHostKey disables verification of the server's host key. This makes the
                              connection vulnerable to man-in-the-middle attacks, only use it for testing.
                            type: boolean
                          knownHosts:
                            description: |-
                              knownHosts holds the host keys of the Git server in known_hosts format, for example the
                              output of "ssh-keyscan -t ed25519 github.com". Host keys are public, so they are part
                              of the spec instead of a Secret. Required unless insecureIgnoreHostKey is true.
                            maxLength: 65536
                            type: string
                          passphraseSecretRef:
                            description: |-
                              passphraseSecretRef selects the Secret key that holds the passphrase of the private key.
                              The key defaults to "passphrase". Omit it for unencrypted keys.
                            properties:
                              key:
                                description: |-
                                  key within the Secret's data. When omitted a default that depends on the referencing
                                  field is used; the default is documented on that field.
                                maxLength: 253
                                pattern: ^[-._a-zA-Z0-9]+$
                                type: string
                              name:
                                description: name of the Secret.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                              namespace:
                                description: |-
                                  namespace of the Secret. Required on a ClusterPasswordStore. On a PasswordStore it may be
                                  omitted and otherwise must equal the namespace of the store: cross-namespace references
                                  are not allowed.
                                maxLength: 63
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                            required:
                            - name
                            type: object
                          privateKeySecretRef:
                            description: |-
                              privateKeySecretRef selects the Secret key that holds the private key in PEM or OpenSSH
                              format. The key defaults to "ssh-privatekey", which matches Secrets of type
                              kubernetes.io/ssh-auth. The user name is taken from the repository URL and defaults to "git".
                            properties:
                              key:
                                description: |-
                                  key within the Secret's data. When omitted a default that depends on the referencing
                                  field is used; the default is documented on that field.
                                maxLength: 253
                                pattern: ^[-._a-zA-Z0-9]+$
                                type: string
                              name:
                                description: name of the Secret.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                              namespace:
                                description: |-
                                  namespace of the Secret. Required on a ClusterPasswordStore. On a PasswordStore it may be
                                  omitted and otherwise must equal the namespace of the store: cross-namespace references
                                  are not allowed.
                                maxLength: 63
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - privateKeySecretRef
                        type: object
                        x-kubernetes-validations:
                        - message: knownHosts is required unless insecureIgnoreHostKey
                            is true
                          rule: (has(self.knownHosts) && self.knownHosts.trim().size()
                            > 0) || (has(self.insecureIgnoreHostKey) && self.insecureIgnoreHostKey)
                        - message: knownHosts and insecureIgnoreHostKey are mutually
                            exclusive
                          rule: '!(has(self.knownHosts) && self.knownHosts.trim().size()
                            > 0 && has(self.insecureIgnoreHostKey) && self.insecureIgnoreHostKey)'
                      token:
                        description: token authenticates over http(s) with a personal
                          access token, deploy token or similar.
                        properties:
                          tokenSecretRef:
                            description: tokenSecretRef selects the Secret key that
                              holds the token. The key defaults to "token".
                            properties:
                              key:
                                description: |-
                                  key within the Secret's data. When omitted a default that depends on the referencing
                                  field is used; the default is documented on that field.
                                maxLength: 253
                                pattern: ^[-._a-zA-Z0-9]+$
                                type: string
                              name:
                                description: name of the Secret.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                              namespace:
                                description: |-
                                  namespace of the Secret. Required on a ClusterPasswordStore. On a PasswordStore it may be
                                  omitted and otherwise must equal the namespace of the store: cross-namespace references
                                  are not allowed.
                                maxLength: 63
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                            required:
                            - name
                            type: object
                          username:
                            description: |-
                              username sent together with the token. Defaults to "x-access-token", which GitHub and
                              GitLab accept for personal access tokens. Some providers require a specific value,
                              for example "oauth2" for GitLab OAuth tokens or "x-token-auth" for Bitbucket.
                            maxLength: 255
                            type: string
                        required:
                        - tokenSecretRef
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: at most one of ssh, token or app may be set
                      rule: '[has(self.ssh), has(self.token), has(self.app)].filter(x,
                        x).size() <= 1'
                  branch:
                    description: branch to read the store from. Defaults to the default
                      branch of the remote.
                    maxLength: 255
                    type: string
                  path:
                    description: |-
                      path of the password store inside the repository, that is the directory that holds
                      the .gpg-id file. Defaults to the root of the repository.
                    maxLength: 1024
                    type: string
                  url:
                    description: |-
                      url of the Git repository. Supported forms are https://host/org/repo.git,
                      http://host/org/repo.git, ssh://[user@]host[:port]/org/repo.git and the scp-like
                      [user@]host:org/repo.git or [user@]host:/absolute/repo.git. Credentials must not be embedded in
                      the URL, use auth instead. http:// sends credentials, if there are any, in the clear.
                    maxLength: 2048
                    minLength: 1
                    pattern: ^(https?://[^@/\s]+(/\S*)?|ssh://([^@:/\s]+@)?[^@/\s]+(/\S*)?|([A-Za-z0-9._-]+@)?[A-Za-z0-9._-]+:(/[^/\s]|[^/\s])\S*)$
                    type: string
                required:
                - url
                type: object
                x-kubernetes-validations:
                - message: ssh and scp-style URLs require auth.ssh
                  rule: '!(self.url.startsWith(''ssh://'') || !self.url.contains(''://''))
                    || (has(self.auth) && has(self.auth.ssh))'
                - message: auth.ssh requires an ssh:// or scp-style URL
                  rule: '!has(self.auth) || !has(self.auth.ssh) || self.url.startsWith(''ssh://'')
                    || !self.url.contains(''://'')'
                - message: auth.token and auth.app require an http(s):// URL
                  rule: '!has(self.auth) || !(has(self.auth.token) || has(self.auth.app))
                    || self.url.startsWith(''https://'') || self.url.startsWith(''http://'')'
              gpg:
                description: gpg describes the GPG key used to decrypt the entries
                  of the store.
                properties:
                  id:
                    description: |-
                      id of the GPG key the store is encrypted to, as given to "pass init". It can be a
                      fingerprint, a long or short key ID, or part of a user ID such as an email address.
                      It selects the key to use when the Secret holds more than one.
                    maxLength: 256
                    minLength: 1
                    type: string
                  passphraseSecretRef:
                    description: |-
                      passphraseSecretRef selects the Secret key that holds the passphrase of the private key.
                      The key defaults to "passphrase". Omit it for keys without a passphrase.
                    properties:
                      key:
                        description: |-
                          key within the Secret's data. When omitted a default that depends on the referencing
                          field is used; the default is documented on that field.
                        maxLength: 253
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name of the Secret.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      namespace:
                        description: |-
                          namespace of the Secret. Required on a ClusterPasswordStore. On a PasswordStore it may be
                          omitted and otherwise must equal the namespace of the store: cross-namespace references
                          are not allowed.
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                  privateKeySecretRef:
                    description: |-
                      privateKeySecretRef selects the Secret key that holds the private key, ASCII-armored or
                      binary, as written by "gpg --export-secret-keys". The key defaults to "private.key".
                    properties:
                      key:
                        description: |-
                          key within the Secret's data. When omitted a default that depends on the referencing
                          field is used; the default is documented on that field.
                        maxLength: 253
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name of the Secret.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      namespace:
                        description: |-
                          namespace of the Secret. Required on a ClusterPasswordStore. On a PasswordStore it may be
                          omitted and otherwise must equal the namespace of the store: cross-namespace references
                          are not allowed.
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                required:
                - id
                - privateKeySecretRef
                type: object
              namespaceSelector:
                description: |-
                  namespaceSelector restricts which namespaces may use this store. A PasswordStoreSecret
                  can only reference the store when the labels of its namespace match the selector. When
                  omitted every namespace may use the store, so any user who can create a
                  PasswordStoreSecret can read every entry the store's key can decrypt.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - gitRepo
            - gpg
            type: object
          status:
            description: status defines the observed state of ClusterPasswordStore
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the store. The Ready condition is True when
                  the repository was fetched and the GPG key was unlocked.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gpgFingerprint:
                description: gpgFingerprint is the fingerprint of the private key
                  that was selected by gpg.id.
                type: string
              lastSyncTime:
                description: lastSyncTime is when the repository was last fetched
                  successfully.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation of the spec that
                  was last reconciled.
                format: int64
                type: integer
              revision:
                description: revision is the commit SHA of the repository that was
                  last fetched successfully.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

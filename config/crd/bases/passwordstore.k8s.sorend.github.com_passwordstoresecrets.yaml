---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: passwordstoresecrets.passwordstore.k8s.sorend.github.com
spec:
  group: passwordstore.k8s.sorend.github.com
  names:
    kind: PasswordStoreSecret
    listKind: PasswordStoreSecretList
    plural: passwordstoresecrets
    shortNames:
    - pwss
    singular: passwordstoresecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.storeRef.name
      name: Store
      type: string
    - jsonPath: .status.secretName
      name: Secret
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.revision
      name: Revision
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PasswordStoreSecret generates a Kubernetes Secret from entries
          of a password store.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PasswordStoreSecret
            properties:
              data:
                additionalProperties:
                  type: string
                description: |-
                  data maps keys of the generated Secret to entries of the password store. Each value is
                  the path of an entry relative to the root of the store, without the .gpg suffix, for
                  example k8s/postgres.db.svc/admin-user.

                  A path on its own yields the whole decrypted entry. If the entry is a single line its
                  trailing newline is removed, entries with several lines are used as they are. A path can
                  be followed by a selector: "path#2" yields line 2 of the entry (so "path#1" is the first
                  line, which pass(1) treats as the password) and "path#username" yields the value of the
                  first "username: value" line after the first line of the entry, ignoring case. The name of
                  a field has no colon in it.
                maxProperties: 100
                minProperties: 1
                type: object
                x-kubernetes-validations:
                - message: keys must be 1 to 253 alphanumeric characters, '-', '_'
                    or '.', and must not be '.' or start with '..'
                  rule: self.all(k, size(k) <= 253 && k.matches('^[-._a-zA-Z0-9]+$')
                    && k != '.' && !k.startsWith('..'))
              refreshInterval:
                default: 5m
                description: |-
                  refreshInterval is how often the store is checked for changes and the Secret is
                  rendered again. A Secret is also refreshed as soon as its store sees a new commit.
                type: string
                x-kubernetes-validations:
                - message: refreshInterval must be at least 10s
                  rule: duration(self) >= duration('10s')
              storeRef:
                description: storeRef selects the password store to read the entries
                  from.
                properties:
                  kind:
                    default: PasswordStore
                    description: |-
                      kind of the store. A PasswordStore is looked up in the namespace of the
                      PasswordStoreSecret, a ClusterPasswordStore is cluster-wide.
                    enum:
                    - PasswordStore
                    - ClusterPasswordStore
                    type: string
                  name:
                    description: name of the store.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              template:
                description: template describes the Secret that is generated, much
                  like the template of a SealedSecret.
                properties:
                  metadata:
                    description: metadata of the generated Secret.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: annotations added to the generated Secret.
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: labels added to the generated Secret.
                        type: object
                      name:
                        description: |-
                          name of the generated Secret. Defaults to the name of the PasswordStoreSecret. The Secret
                          is always created in the namespace of the PasswordStoreSecret.
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    type: object
                  type:
                    description: |-
                      type of the generated Secret, for example kubernetes.io/tls. Defaults to Opaque.
                      Kubernetes does not allow the type of an existing Secret to change. A Secret of type
                      kubernetes.io/service-account-token cannot be generated: Kubernetes fills such a Secret with
                      the token of a ServiceAccount, which this resource would otherwise give to whoever can create it.
                    maxLength: 253
                    type: string
                    x-kubernetes-validations:
                    - message: Secrets of type kubernetes.io/service-account-token
                        cannot be generated
                      rule: self != 'kubernetes.io/service-account-token'
                type: object
            required:
            - data
            - storeRef
            type: object
          status:
            description: status defines the observed state of PasswordStoreSecret
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the resource. The Ready condition is True when
                  the Secret was rendered from the latest revision of the store.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastRefreshTime:
                description: lastRefreshTime is when the Secret was last rendered
                  successfully.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation of the spec that
                  was last reconciled.
                format: int64
                type: integer
              revision:
                description: revision is the commit SHA of the store that the Secret
                  was last rendered from.
                type: string
              secretName:
                description: secretName is the name of the generated Secret.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

name: CI

# Pushes to main and pull requests are linted, tested and built. A push of a tag that starts with
# "v" does the same and then publishes the image for amd64 and arm64 to ghcr.io and creates a
# GitHub release with the installer, but only if everything passed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # A run for a tag publishes a release, it must not be cancelled by another push.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The tests check the operator against the real pass, GnuPG and git. Those that need pass are
      # skipped when it is not installed. git and gpg are part of the runner image.
      - name: Install pass
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pass

      # A go.mod that is not tidy shows up as a difference in the check below.
      - name: Tidy the modules
        run: go mod tidy

      - name: Run the unit tests and the controller tests
        run: make test

      - name: Show the coverage
        run: go tool cover -func=cover.out | tail -n 1

      # make test generates the CRDs, the RBAC and the DeepCopy code. They are committed, so a
      # difference means that someone changed the API and did not run "make manifests generate".
      - name: Check that the generated files are committed
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make manifests generate' and commit the result."
            exit 1
          fi

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          if ! command -v kind >/dev/null 2>&1; then
            curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
            chmod +x ./kind
            sudo mv ./kind /usr/local/bin/kind
          fi
          kind version

      # Builds the image, deploys it to a new kind cluster and runs the scenarios against it.
      - name: Run the e2e tests
        run: make test-e2e

  image:
    name: Image (amd64, arm64)
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push the image, which only happens for tags
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile compiles on the machine that builds the image and cross-compiles for the
      # target, and never runs anything for the target. So the arm64 image is built without
      # emulation, and there is no need to set up QEMU.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 gives 1.2.3, 1.2, 1 and latest. The floating major version is left out for 0.x, whose
      # minor versions are allowed to break things, and a pre-release such as v1.2.3-rc.1 only gets its own
      # tag. The labels link the package to this repository.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      # Other events only check that the image builds for both platforms, nothing is pushed.
      - name: Build, and push for tags
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check that the image that was pushed has both architectures
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$image"
          platforms="$(docker buildx imagetools inspect "$image" --format '{{range .Manifest.Manifests}}{{if .Platform}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}')"
          echo "platforms: $platforms"
          for want in linux/amd64 linux/arm64; do
            case " $platforms " in
              *" $want "*) ;;
              *) echo "::error::The image has no $want variant."; exit 1 ;;
            esac
          done

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # One file with the CRDs, the permissions and the deployment, for the image of this release:
      # kubectl apply -f https://github.com/<owner>/<repo>/releases/latest/download/install.yaml
      - name: Build the installer
        run: make build-installer IMG="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The run was started again, for example after a failure.
            gh release upload "$GITHUB_REF_NAME" dist/install.yaml --clobber
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" dist/install.yaml \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${prerelease[@]}"
          fi
